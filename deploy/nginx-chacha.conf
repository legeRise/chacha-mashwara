# Add this inside the nginx server block for openchamber.ez-clip.ovh,
# before the existing "location /" proxy block.

location = /chacha {
    return 301 /chacha/;
}

location /chacha/ {
    root /var/www;
    try_files $uri $uri/ /chacha/index.html;
}

# The built UI lives at /var/www/chacha (see tools/deploy_ui.sh).
# Public URL: https://openchamber.ez-clip.ovh/chacha/
