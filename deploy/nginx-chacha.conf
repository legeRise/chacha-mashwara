# Dedicated nginx site for chacha.ez-clip.ovh
# Install at /etc/nginx/sites-available/chacha.ez-clip.ovh
# Then: sudo ln -s .../sites-available/... /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#       sudo certbot --nginx -d chacha.ez-clip.ovh --redirect
#
# The built UI lives at /var/www/chacha (see tools/deploy_ui.sh).

server {
    listen 80;
    listen [::]:80;
    server_name chacha.ez-clip.ovh;

    root /var/www/chacha;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 480s;
        proxy_send_timeout 480s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }
}
